<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LoL Tabu">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>LoL Tabu</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --phone-max-width: 430px;
      --phone-max-height: 860px;
      --phone-radius: 26px;
      --phone-aspect: 9 / 19.5;
      --chrome-bg: radial-gradient(circle at 18% 12%, #1f2b59 0%, #0b1021 45%, #070a16 100%);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--chrome-bg);
    }

    body > flutter-view,
    body > flt-glass-pane {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      inset: 0 !important;
      margin: 0 !important;
      border-radius: 0;
      overflow: hidden;
      box-shadow: none;
    }

    @media (min-width: 760px) {
      body {
        display: grid;
        place-items: center;
        padding: 20px;
        box-sizing: border-box;
      }

      body > flutter-view,
      body > flt-glass-pane {
        position: relative !important;
        inset: auto !important;
        width: min(var(--phone-max-width), calc((100vh - 40px) * 9 / 19.5), calc(100vw - 40px)) !important;
        height: min(var(--phone-max-height), calc(100vh - 40px), calc((100vw - 40px) * 19.5 / 9)) !important;
        aspect-ratio: var(--phone-aspect);
        border-radius: var(--phone-radius);
        overflow: hidden;
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.08);
      }

      body > flt-glass-pane > flt-scene-host,
      body > flt-glass-pane canvas,
      body > flutter-view canvas {
        width: 100% !important;
        height: 100% !important;
      }
    }
  </style>
</head>

<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
